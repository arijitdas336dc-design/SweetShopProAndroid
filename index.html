<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#7b2d26"><title>Sweet Shop Pro</title><style>
:root{--brand:#7b2d26;--bg:#f6f3ef;--card:#fff;--muted:#706a65;--line:#e8e1db}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#292522}.top{background:var(--brand);color:#fff;padding:20px 16px 14px;position:sticky;top:0;z-index:2}.top h1{margin:0;font-size:21px}.top small{opacity:.85}.tabs{display:flex;overflow:auto;gap:7px;padding:10px;background:#fff;position:sticky;top:65px;z-index:2;border-bottom:1px solid var(--line)}.tabs button{white-space:nowrap;border:0;border-radius:20px;padding:9px 13px;background:#f1eae5;color:#4a3833}.tabs button.active{background:var(--brand);color:#fff}.wrap{padding:14px;max-width:760px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}.metric{font-size:22px;font-weight:750;margin-top:4px}.muted{color:var(--muted);font-size:12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.field{margin:10px 0}label{display:block;font-size:13px;color:#5e5751;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d9d0c8;border-radius:9px;padding:11px;background:#fff;font:inherit;color:#282421}button.primary{border:0;border-radius:10px;background:var(--brand);color:white;padding:12px 16px;font-weight:650;width:100%;margin-top:7px}button.secondary{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px}.entry{padding:10px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.hidden{display:none}.good{color:#167447}.bad{color:#b42318}h2{font-size:17px;margin:5px 0 12px}h3{font-size:14px;margin:0 0 7px}.pill{background:#f4ece7;border-radius:20px;padding:4px 8px;font-size:11px}.empty{padding:18px;text-align:center;color:var(--muted)}
</style></head><body><header class="top"><h1>🍬 Sweet Shop Pro</h1><small>Shop owner accounting & daily hisab</small></header><nav class="tabs" id="tabs"></nav><main class="wrap" id="app"></main><script>
const KEY='sweet_shop_pro_android_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"sales":[],"expenses":[],"employees":[],"attendance":[],"payroll":[]}');let page='Dashboard';const money=n=>'₹'+(Number(n||0)).toLocaleString('en-IN',{maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);const month=()=>today().slice(0,7);function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const pages=['Dashboard','Sales','Expenses','Attendance','Employees','Payroll','P&L','Backup'];
function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}function nav(){document.getElementById('tabs').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="page='${p}';render()">${p}</button>`).join('')}
function card(label,value,sub=''){return `<div class="card"><div class="muted">${label}</div><div class="metric">${money(value)}</div><div class="muted">${sub}</div></div>`}function formField(label,id,type='text',placeholder='',opts=null){let el=opts?`<select id="${id}">${opts.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input id="${id}" type="${type}" placeholder="${placeholder}" value="${type==='date'||type==='month'?placeholder:''}" ${type==='number'?'min="0" step="0.01"':''}>`;return `<div class="field"><label>${label}</label>${el}</div>`}function val(id){return document.getElementById(id).value}function addSale(){let amount=+val('amount');if(amount<=0)return alert('Enter a valid amount');db.sales.push({date:val('date'),amount,mode:val('mode'),note:val('note')});save()}function addExpense(){let amount=+val('amount');if(amount<=0)return alert('Enter a valid amount');db.expenses.push({date:val('date'),amount,category:val('category'),nature:val('nature'),mode:val('mode'),note:val('note')});save()}function addEmployee(){let name=val('name').trim();if(!name)return alert('Enter employee name');db.employees.push({id:Date.now(),name,role:val('role'),type:val('type'),daily:+val('daily'),salary:+val('salary'),active:true});save()}function addAttendance(){let employee=+val('employee'),date=val('date'),status=val('status'),hours=+val('hours');db.attendance=db.attendance.filter(x=>!(x.employee===employee&&x.date===date));db.attendance.push({employee,date,status,hours});save()}function addPay(){let employee=+val('employee'),amount=+val('amount');if(amount<=0)return alert('Enter amount');db.payroll.push({employee,date:val('date'),month:val('month'),amount,type:val('type'),mode:val('mode')});save()}
function list(items,render){return items.length?items.slice().reverse().map(render).join(''):'<div class="empty">No entries yet</div>'}function render(){nav();let a=document.getElementById('app'),t=today(),m=month(),sales=db.sales.filter(x=>x.date===t),expenses=db.expenses.filter(x=>x.date===t),ms=db.sales.filter(x=>x.date.startsWith(m)),me=db.expenses.filter(x=>x.date.startsWith(m));let wages=db.attendance.filter(x=>x.date.startsWith(m)).reduce((s,x)=>{let e=db.employees.find(y=>y.id===x.employee);return s+(e&&e.type==='Daily Wage'?(x.status==='Present'||x.status==='Overtime'?e.daily:x.status==='Half Day'?e.daily/2:0)+(x.hours*(e.daily/8)):0)},0);if(page==='Dashboard'){let present=db.attendance.filter(x=>x.date===t&&x.status!=='Absent').length,absent=db.attendance.filter(x=>x.date===t&&x.status==='Absent').length;a.innerHTML=`<h2>Owner dashboard</h2><div class="muted">${t}</div><div class="grid">${card("Today's sales",sum(sales))}${card("Today's expenses",sum(expenses))}${card('Monthly sales',sum(ms))}${card('Monthly expenses',sum(me))}</div><div class="card"><div class="row"><b>Today's operating balance</b><b class="${sum(sales)-sum(expenses)>=0?'good':'bad'}">${money(sum(sales)-sum(expenses))}</b></div><div class="muted">Sales less recorded expenses; wages not included here.</div></div><div class="grid"><div class="card"><div class="muted">Present today</div><div class="metric">${present}</div></div><div class="card"><div class="muted">Absent today</div><div class="metric">${absent}</div></div></div><div class="card"><h3>Quick actions</h3><div class="grid"><button class="secondary" onclick="page='Sales';render()">+ Add sale</button><button class="secondary" onclick="page='Expenses';render()">+ Add expense</button><button class="secondary" onclick="page='Attendance';render()">Mark attendance</button><button class="secondary" onclick="page='P&L';render()">View monthly P&L</button></div></div>`}
else if(page==='Sales')a.innerHTML=`<h2>Daily sales register</h2><div class="card">${formField('Date','date','date',t)}${formField('Sales amount (₹)','amount','number')}${formField('Payment mode','mode','text','',['Cash','UPI','Card','Bank','Credit / Udhaar'])}${formField('Description','note','text','Optional note')}<button class="primary" onclick="addSale()">Save sale</button></div><div class="card"><h3>Recent sales</h3>${list(db.sales,x=>`<div class="entry"><div class="row"><b>${money(x.amount)}</b><span class="pill">${esc(x.mode)}</span></div><div class="muted">${esc(x.date)} · ${esc(x.note)}</div></div>`)}</div>`
else if(page==='Expenses')a.innerHTML=`<h2>Expense register</h2><div class="card">${formField('Date','date','date',t)}${formField('Amount (₹)','amount','number')}${formField('Category','category','text','',['Raw materials / stock','Milk & dairy','Sugar','Flour','Ghee / oil','Dry fruits','Packaging','Gas / fuel','Electricity / water','Rent','Transport','Maintenance','Marketing','Other'])}${formField('Expense nature','nature','text','',['Stock Purchase','Operating Expense','Capital Purchase'])}${formField('Payment mode','mode','text','',['Cash','UPI','Card','Bank'])}${formField('Supplier / description','note','text','Optional')}<button class="primary" onclick="addExpense()">Save expense</button></div><div class="card"><h3>Recent expenses</h3>${list(db.expenses,x=>`<div class="entry"><div class="row"><b>${money(x.amount)}</b><span class="pill">${esc(x.nature)}</span></div><div class="muted">${esc(x.date)} · ${esc(x.category)} · ${esc(x.note)}</div></div>`)}</div>`
else if(page==='Employees')a.innerHTML=`<h2>Employee management</h2><div class="card">${formField('Employee name','name')}${formField('Job role','role')}${formField('Salary type','type','text','',['Daily Wage','Monthly Salary'])}${formField('Daily wage (₹)','daily','number')}${formField('Monthly salary (₹)','salary','number')}<button class="primary" onclick="addEmployee()">Add employee</button></div><div class="card"><h3>Employees</h3>${list(db.employees.filter(x=>x.active),x=>`<div class="entry"><b>${esc(x.name)}</b><div class="muted">${esc(x.role)} · ${esc(x.type)} · ${money(x.type==='Daily Wage'?x.daily:x.salary)}</div></div>`)}</div>`
else if(page==='Attendance')a.innerHTML=`<h2>Employee attendance</h2><div class="card">${formField('Date','date','date',t)}${formField('Employee','employee','text','',db.employees.filter(x=>x.active).map(x=>`${x.id} — ${x.name}`))}${formField('Status','status','text','',['Present','Half Day','Absent','Overtime'])}${formField('Overtime hours','hours','number')}<button class="primary" onclick="addAttendance()">Save attendance</button></div><div class="card"><h3>Attendance entries</h3>${list(db.attendance.filter(x=>x.date===t),x=>{let e=db.employees.find(y=>y.id===x.employee);return `<div class="entry"><b>${esc(e?.name||'Employee')}</b><div class="muted">${esc(x.date)} · ${esc(x.status)} · OT: ${x.hours||0}h</div></div>`})}</div>`
else if(page==='Payroll')a.innerHTML=`<h2>Payroll & wage payments</h2><div class="card">${formField('Employee','employee','text','',db.employees.filter(x=>x.active).map(x=>`${x.id} — ${x.name}`))}${formField('Payment date','date','date',t)}${formField('Salary month','month','month',m)}${formField('Amount paid (₹)','amount','number')}${formField('Payment type','type','text','',['Wage Payment','Salary Payment','Advance'])}${formField('Payment mode','mode','text','',['Cash','UPI','Bank'])}<button class="primary" onclick="addPay()">Record payment</button></div><div class="card"><h3>Recent payments</h3>${list(db.payroll,x=>`<div class="entry"><b>${money(x.amount)}</b><div class="muted">${esc(db.employees.find(y=>y.id===x.employee)?.name||'Employee')} · ${esc(x.date)} · ${esc(x.type)}</div></div>`)}</div>`
else if(page==='P&L'){let stock=sum(me.filter(x=>x.nature==='Stock Purchase')),op=sum(me.filter(x=>x.nature==='Operating Expense')),cap=sum(me.filter(x=>x.nature==='Capital Purchase')),monthSalary=db.employees.filter(x=>x.active&&x.type==='Monthly Salary').reduce((s,x)=>s+x.salary,0),earned=wages+monthSalary;let paid=sum(db.payroll.filter(x=>x.month===m));let totalSales=sum(ms),surplus=totalSales-stock-op-earned;a.innerHTML=`<h2>Monthly profit & loss</h2><div class="card">${formField('Select month','reportMonth','month',m)}<button class="primary" onclick="renderPL()">Update report</button></div><div id="pl"></div>`;renderPL()}
else if(page==='Backup')a.innerHTML=`<h2>Backup & restore</h2><div class="card"><p>All records are stored on this phone in this app. Export backups regularly before changing phones or clearing app data.</p><button class="primary" onclick="backup()">Download JSON backup</button><div class="field"><label>Restore JSON backup</label><input type="file" id="restoreFile" accept="application/json"></div><button class="primary" onclick="restore()">Restore backup</button></div><div class="card"><h3>Data summary</h3><p class="muted">Sales: ${db.sales.length} · Expenses: ${db.expenses.length} · Employees: ${db.employees.length} · Attendance: ${db.attendance.length} · Payroll: ${db.payroll.length}</p><button class="secondary" onclick="if(confirm('Delete all shop records permanently? Export a backup first.')){localStorage.removeItem(KEY);location.reload()}">Clear all records</button></div>`}
function renderPL(){let m=val('reportMonth')||month(),ms=db.sales.filter(x=>x.date.startsWith(m)),me=db.expenses.filter(x=>x.date.startsWith(m)),stock=sum(me.filter(x=>x.nature==='Stock Purchase')),op=sum(me.filter(x=>x.nature==='Operating Expense')),cap=sum(me.filter(x=>x.nature==='Capital Purchase')),daily=db.attendance.filter(x=>x.date.startsWith(m)).reduce((s,x)=>{let e=db.employees.find(y=>y.id===x.employee);return s+(e&&e.type==='Daily Wage'?(x.status==='Present'||x.status==='Overtime'?e.daily:x.status==='Half Day'?e.daily/2:0)+(x.hours*(e.daily/8)):0)},0),salary=db.employees.filter(x=>x.active&&x.type==='Monthly Salary').reduce((s,x)=>s+x.salary,0),wages=daily+salary,sales=sum(ms),surplus=sales-stock-op-wages;document.getElementById('pl').innerHTML=`<div class="grid">${card('Sales',sales)}${card('Stock purchases',stock)}${card('Operating expenses',op)}${card('Wages / salary accrued',wages)}</div><div class="card"><div class="row"><b>Preliminary operating surplus</b><b class="${surplus>=0?'good':'bad'}">${money(surplus)}</b></div><p class="muted">Sales − stock purchases − operating expenses − wages accrued. This is not formal net profit. Proper accounts require opening/closing inventory, cost of goods sold, tax and other adjustments.</p><div class="entry">Capital purchases (excluded from operating result): <b>${money(cap)}</b></div><div class="entry">Wages/salary paid (payments recorded for selected month): <b>${money(sum(db.payroll.filter(x=>x.month===m)))}</b></div></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='sweet-shop-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u)}function restore(){let f=document.getElementById('restoreFile').files[0];if(!f)return alert('Choose a backup file');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.sales||!d.expenses||!d.employees)throw 0;db=d;save();alert('Backup restored')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
render();
</script></main></body></html>
